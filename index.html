    (function () {

      var send = function (kind, msg) {
        try { new Image().src = './__err?' + encodeURIComponent((kind + ': ' + msg + ' | ' + navigator.userAgent).slice(0, 1800)); } catch (_) {}
      };
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) { send('load-fail', t.src || t.href); return; }
        send('error', (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') + ' ' + ((e.error && e.error.stack) || '').split('\n').slice(0, 3).join(' <- '));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { send('rejection', (e.reason && (e.reason.message + ' ' + e.reason.stack)) || String(e.reason)); });
      // Cache-bust every JS module on dev hosts via an import map, so a phone
      // can never pair a fresh module with a stale cached one.
      try {
        var v = String(Date.now()), files = ["./js/app.js", "./js/backup.js", "./js/chartMath.js", "./js/coach.js", "./js/config.js", "./js/db.js", "./js/dev/mock.js", "./js/dev/mockReview.js", "./js/dev/mockSuggest.js", "./js/dish.js", "./js/exif.js", "./js/fitness.js", "./js/foodLogic.js", "./js/gemini.js", "./js/googleAuth.js", "./js/health.js", "./js/mealPlan.js", "./js/migrate.js", "./js/photos.js", "./js/planLogic.js", "./js/reminderRunner.js", "./js/reminders.js", "./js/rules.js", "./js/store.js", "./js/storeLogic.js", "./js/summaryModel.js", "./js/trend.js", "./js/ui/aiKeySheet.js", "./js/ui/calendar.js", "./js/ui/camera.js", "./js/ui/challenges.js", "./js/ui/dom.js", "./js/ui/fx.js", "./js/ui/planner.js", "./js/ui/reviewSheet.js", "./js/ui/sheet.js", "./js/ui/stats.js", "./js/ui/stepEditor.js", "./js/ui/summary.js", "./js/ui/today.js"];
        var imports = {};
        for (var i = 0; i < files.length; i++) imports[new URL(files[i], location.href).href] = files[i] + '?v=' + v;
        var map = document.createElement('script');
        map.type = 'importmap';
        map.textContent = JSON.stringify({ imports: imports });
        document.currentScript.after(map);
      } catch (_) {}
      setTimeout(function () {
        var app = document.getElementById('app');
        if (app && !app.children.length) send('stuck', 'app still empty after 6s');
      }, 6000);
    })();
